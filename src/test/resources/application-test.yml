spring:
  datasource:
    url: jdbc:h2:mem:eclinique-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: "test-secret-key-for-jwt-signing-must-be-long-enough-1234567890"
    expiration-ms: 3600000
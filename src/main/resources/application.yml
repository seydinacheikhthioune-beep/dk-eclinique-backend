server:
  # Railway injecte la variable PORT ; 8282 en local
  port: ${PORT:8282}
  servlet:
    context-path: /api

spring:
  application:
    name: e-clinique-backend

  # ==== MySQL ====
  # Sur Railway, les variables MYSQLHOST / MYSQLPORT / MYSQLDATABASE / MYSQLUSER / MYSQLPASSWORD
  # sont fournies par le service MySQL (via des références de variables).
  # DB_URL / DB_USERNAME / DB_PASSWORD permettent de tout surcharger si besoin.
  datasource:
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:eclinique}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:root}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ==== E-mails (factures, exports comptables) ====
  # Exemple Gmail : MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=adresse, MAIL_PASSWORD=mot de passe d'application
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:eCliniqueSecretKeyForJwtSigningMustBeLongEnough1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  stock:
    seuil-alerte-defaut: 10
  mail:
    # Adresse d'expédition (par défaut MAIL_USERNAME) et nom affiché
    expediteur: ${MAIL_FROM:${MAIL_USERNAME:}}
    nom-expediteur: ${MAIL_FROM_NAME:SEYNI SY MEDICAL}
    # Destinataire par défaut des exports comptables (plusieurs adresses séparées par des virgules)
    comptable: ${COMPTABLE_EMAIL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Lancer en local avec H2 (sans MySQL) :
# mvn spring-boot:run -Dspring-boot.run.profiles=h2
